# Capacity-matched CNN candidate derived from the strongest verified control:
# weighted-sum pooling plus moderate, targeted field-101 masking. Bounded bag
# statistics match the information exposed to the tuned DCN.
model: cnn_attention

training:
  epochs: 5
  batch_size: 1000
  eval_batch_size: 8192
  lr: 0.001
  weight_decay: 0.000003
  grad_clip_norm: 0
  seed: 42
  shuffle_block_size: 1
  checkpoint_metric: ctr_auc
  keep_checkpoint: best
  save_predictions: false
  evaluate_test: true
  gpus: -1
  load_test: false
  out_dir: artifacts
  early_stopping:
    enabled: true
    patience: 2
    min_delta: 0.0001

model_params:
  architecture_version: 2
  emb_dim: 20
  conv_channels: [32, 64, 32]
  kernel_size: 3
  tower_dims: [128, 64, 32]
  dropout: 0.2
  alpha: 1.0
  pooling: sum
  bag_stats: true
  use_missing_embedding: false
  use_presence_features: true
  # Keep task transfer equivalent to the successful legacy recipe; these
  # options do not feed the CTR head at inference.
  normalize_task_representations: false
  attention_score: dot
  conversion_residual: false
  field_dropout:
    "101": 0.10

data:
  csv_dir: ali-ccp/extracted
  encoded_dir: ali-ccp/encoded
