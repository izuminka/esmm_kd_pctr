model: dcn

training:
  # Values below follow the DCN-V2 pCTR recipe in
  # paper/frozen_pctr_iclr2027.tex (appendix "Ali-CCP Reproduction Recipes").
  epochs: 5           # paper caps training at five epochs
  batch_size: 65536   # paper's global batch (4 replicas x 16,384); here one GPU
  eval_batch_size: 65536  # eval runs under no_grad, so it fits a bigger batch
  lr: 0.0005
  grad_clip_norm: 10  # dense gradients only; embedding updates are left unclipped
  seed: 42
  shuffle_block_size: 65536  # epoch shuffling permutes blocks, not rows
  gpus: -1            # -1 = single GPU (cuda:0) if available; 0 = CPU only
  load_test: true     # false leaves the test split on disk to save VRAM,
                      # which also skips its prediction export
  out_dir: artifacts  # relative to project root (parent of code/)
  early_stopping:
    patience: 2       # paper: patience two, zero minimum delta
    min_delta: 0.0

model_params:
  emb_dim: 64
  cross_rank: 256
  num_cross_layers: 4
  deep_hidden_dims: [2048, 1024, 512]
  dropout: 0.1

data:
  # paths relative to project root
  csv_dir: ali-cpp/extracted   # directory containing common_features_{train,test}.csv etc.
  encoded_dir: encoded         # preprocessed numpy arrays (run scripts/preprocess.py once)
  # field_ids: omit to use all fields discovered in training data
