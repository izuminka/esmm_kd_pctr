model: dcn

training:
  # Ali-CCP DCN-V2 literature recipe: two parallel cross layers, Adam at 1e-4,
  # 1e-6 weight decay, and 0.1 dropout.  We retain the capacity-matched
  # embeddings and bounded per-field statistics required by this encoding.
  epochs: 5
  batch_size: 65536
  eval_batch_size: 65536
  lr: 0.0001
  weight_decay: 0.000001
  grad_clip_norm: 10
  seed: 42
  shuffle_block_size: 1
  checkpoint_metric: ctr_ne
  keep_checkpoint: best
  save_predictions: true
  evaluate_test: false
  gpus: -1
  load_test: false
  out_dir: artifacts
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0

model_params:
  emb_dim: 20
  cross_rank: 128
  num_cross_layers: 2
  deep_hidden_dims: [512, 256, 128]
  dropout: 0.1
  pooling: mean
  bag_stats: true
  cross_init: xavier
  head_init: xavier

data:
  csv_dir: ali-ccp/extracted
  encoded_dir: ali-ccp/encoded
