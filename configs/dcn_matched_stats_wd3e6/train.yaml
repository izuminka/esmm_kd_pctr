model: dcn

training:
  # One-factor regularization ablation of dcn_matched_stats.
  # Adam coupled L2 penalty on all parameters; select by validation NE only.
  epochs: 5
  batch_size: 65536
  eval_batch_size: 65536
  lr: 0.0005
  weight_decay: 0.000003
  grad_clip_norm: 10
  seed: 42
  shuffle_block_size: 1
  stratify_batches: true  # each batch holds nonclicks, clicks and conversions in proportion
  checkpoint_metric: ctr_ne
  keep_checkpoint: best
  save_predictions: true
  evaluate_test: false
  gpus: -1
  load_test: false
  out_dir: artifacts_final
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0

model_params:
  output_bias_init:        # start each head at its training base rate
    ctr: 0.03887418        # training clicks / training rows
  emb_dim: 20
  cross_rank: 128
  num_cross_layers: 4
  deep_hidden_dims: [512, 256, 128]
  dropout: 0.1
  pooling: mean
  bag_stats: true

data:
  csv_dir: ali-ccp/extracted
  encoded_dir: ali-ccp/encoded
