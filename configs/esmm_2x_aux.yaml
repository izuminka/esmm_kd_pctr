# ESMM control, 2x aux: the ESMM loss with its auxiliary-CTR term doubled
# (paper Table 2). Identical to esmm.yaml apart from aux_weight.
model: esmm

training:
  epochs: 5           # paper caps training at five epochs
  batch_size: 65536   # paper's global batch (4 replicas x 16,384); here one GPU
  eval_batch_size: 65536  # eval runs under no_grad, so it fits a bigger batch
  lr: 0.001           # paper's ESMM learning rate
  grad_clip_norm: 0   # paper: ESMM uses no gradient clipping
  seed: 42
  shuffle_block_size: 1  # 1 = permute rows; >1 keeps that many consecutive
                         # rows together, which on user-ordered data collapses
                         # a batch to a few hundred distinct users
  checkpoint_metric: ctcvr_prauc  # paper: full/half keep the best validation
                                  # native CTCVR (q*v) PR-AUC
  save_predictions: false  # score train/val/test in memory; write metrics only
  gpus: -1            # -1 = single GPU (cuda:0) if available; 0 = CPU only
  load_test: false    # test + its common table are ~17 GB; holding them beside
                      # train, val and the optimizer state exceeds one 40 GB card.
                      # scripts/predict_encoded.py exports test afterwards.
  out_dir: artifacts  # relative to project root (parent of code/)
  early_stopping:
    patience: 2       # paper: patience two, zero minimum delta
    min_delta: 0.0

model_params:
  emb_dim: 20
  tower_dims: [460, 360, 200, 80, 2]
  aux_weight: 2.0  # whole CTR term doubled; the CTCVR term's weight stays 1

# Frozen DCN-V2 pCTR p, used only to report CTCVR-logged (p * v) beside CTCVR (q * v);
# it is not a model input and not in this model's loss.
logged_pctr:
  dcn_run: artifacts/dcn/20260916T232126Z  # the dcn entry in best_models.yaml
  predictions:  # one file per split, inside dcn_run; joined to rows by sample_id
    train: artifacts/dcn/20260916T232126Z/predictions/train.parquet
    val: artifacts/dcn/20260916T232126Z/predictions/val.parquet
    test: artifacts/dcn/20260916T232126Z/predictions/test.parquet
  score_column: score

evaluation:
  is_logged_ctcvr: true  # also report CTCVR-logged (p * v) beside CTCVR (q * v)

data:
  # paths relative to project root
  csv_dir: ali-ccp/extracted   # directory containing common_features_{train,test}.csv etc.
  encoded_dir: ali-ccp/encoded # preprocessed numpy arrays (run scripts/preprocess.py once)
  # field_ids: omit to use all fields discovered in training data
