# Independent-seed validation comparison; no test evaluation.
model: esmm
training:
  epochs: 5
  batch_size: 65536
  eval_batch_size: 65536
  lr: 0.001
  grad_clip_norm: 0
  seed: 43
  shuffle_block_size: 1
  checkpoint_metric: ctr_ne
  keep_checkpoint: best
  save_predictions: false
  gpus: -1
  load_test: false
  out_dir: artifacts
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0
  evaluate_test: false
model_params:
  emb_dim: 20
  tower_dims:
  - 460
  - 360
  - 200
  - 80
  - 2
  aux_weight: 1.0
evaluation:
  is_logged_ctcvr: false
data:
  csv_dir: ali-ccp/extracted
  encoded_dir: ali-ccp/encoded
