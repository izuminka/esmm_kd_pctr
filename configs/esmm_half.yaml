# ESMM half control (paper Table 2, "ESMM half"): canonical ESMM on the fixed,
# label-independent 19,035,179-row half cohort. Identical to esmm.yaml except for
# data.train_cohort. Validation and test stay the full populations.
model: esmm

training:
  epochs: 5           # common cap; each arm retains its best validation checkpoint
  batch_size: 65536   # paper's global batch (4 replicas x 16,384); here one GPU
  eval_batch_size: 65536  # eval runs under no_grad, so it fits a bigger batch
  lr: 0.001           # paper's ESMM learning rate
  grad_clip_norm: 0   # paper: ESMM uses no gradient clipping
  seed: 42
  shuffle_block_size: 1  # 1 = permute rows; >1 keeps that many consecutive
                         # rows together, which on user-ordered data collapses
                         # a batch to a few hundred distinct users
  checkpoint_metric: pcvr_ne  # minimize CVR NE on clicked validation impressions
  keep_checkpoint: best  # same validation selection rule for full, half and quarter
  save_predictions: false  # score train/val/test in memory; write metrics only
  gpus: -1            # -1 = single GPU (cuda:0) if available; 0 = CPU only
  load_test: false    # test + its common table are ~17 GB; holding them beside
                      # train, val and the optimizer state exceeds one 40 GB card.
                      # scripts/predict_encoded.py exports test afterwards.
  out_dir: artifacts  # relative to project root (parent of code/)
  early_stopping:
    enabled: false
    patience: 2       # stop after two epochs without validation improvement
    min_delta: 0.0

model_params:
  emb_dim: 20
  tower_dims: [460, 360, 200, 80, 2]
  aux_weight: 1.0  # weight on the CTR term; 1 is the canonical ESMM loss

# Frozen DCN-V2 pCTR p, used only for the test CTCVR-logged (p*v) report.
# It is not used for training, validation or checkpoint selection.
logged_pctr:
  dcn_run: artifacts/dcn/20260916T232126Z  # the dcn entry in best_models.yaml
  predictions:  # only required splits; joined by sample_id
    test: artifacts/dcn/20260916T232126Z/predictions/test.parquet
  score_column: score

evaluation:
  is_logged_ctcvr: true  # report p*v only on test; never select on it

data:
  # paths relative to project root
  csv_dir: ali-ccp/extracted   # directory containing common_features_{train,test}.csv etc.
  encoded_dir: ali-ccp/encoded # preprocessed numpy arrays (run scripts/preprocess.py once)
  # field_ids: omit to use all fields discovered in training data
  train_cohort:          # see training/cohorts.py for the selection rule
    fraction: 0.5        # paper: 19,035,179 of 38,070,359 training rows
    ranks: 4             # paper's four data-parallel replicas set the balanced ranges
    block_size: 65536    # rows per block permuted into the stream; the paper's own
                         # block boundaries are unpublished, so size matches, rows may not
    seed: 42             # paper: the block inventory is permuted with seed 42
