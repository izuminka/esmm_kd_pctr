# kd_teacher on the same fixed half cohort as esmm_half.yaml.
model: esmm_logged_pctr
training:
  epochs: 5
  batch_size: 65536
  eval_batch_size: 65536
  lr: 0.001
  grad_clip_norm: 0
  seed: 42
  shuffle_block_size: 1
  checkpoint_metric: logged_ctcvr_ne
  save_predictions: false
  gpus: 1
  load_test: false
  out_dir: artifacts
  keep_checkpoint: best
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0
model_params:
  emb_dim: 20
  tower_dims:
  - 460
  - 360
  - 200
  - 80
  - 2
  objective: kd
  alpha: 0.0
  aux_weight: 1.0
logged_pctr:
  dcn_run: artifacts/dcn_matched_stats_wd3e6/20260917T232959Z
  predictions:
    train: artifacts/dcn_matched_stats_wd3e6/20260917T232959Z/predictions/train.parquet
    val: artifacts/dcn_matched_stats_wd3e6/20260917T232959Z/predictions/val.parquet
    test: artifacts/dcn_matched_stats_wd3e6/20260917T232959Z/predictions/test.parquet
  score_column: score
evaluation:
  is_logged_ctcvr: true
data:
  csv_dir: ali-ccp/extracted
  encoded_dir: ali-ccp/encoded
  train_cohort:
    fraction: 0.5
    ranks: 4
    block_size: 65536
    seed: 42
