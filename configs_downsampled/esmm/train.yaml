model: esmm

training:
  evaluate_test: false  # test belongs to the separate evaluation job
  epochs: 5
  batch_size: 65536
  eval_batch_size: 65536
  lr: 0.001
  grad_clip_norm: 0
  seed: 42
  shuffle_block_size: 1
  checkpoint_metric: ctcvr_ne  # corrected CTR * unchanged CVR, full validation
  keep_checkpoint: best
  save_predictions: false
  gpus: 1
  load_test: false
  out_dir: artifacts_downsampled
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0

model_params:
  emb_dim: 20
  tower_dims: [460, 360, 200, 80, 2]
  aux_weight: 1.0

data:
  csv_dir: ali-ccp/extracted
  encoded_dir: ali-ccp/encoded
  nonclick_sampling:
    rate: 0.5
    seed: 2026  # independent of model initialization, fixed across epochs
