# Robust CNN + attention recipe for the Ali-CCP official-file protocol.
# The paper's 0.661 uses a different split; see models/CNN_ATTENTION.md.
model: cnn_attention

training:
  epochs: 5
  batch_size: 1000
  eval_batch_size: 1000
  lr: 0.001
  weight_decay: 0.0
  grad_clip_norm: 0
  seed: 42
  shuffle_block_size: 1
  # Select on a deterministic validation mixture with field 101 missing at its
  # measured official-test rate, rather than on same-user validation alone.
  checkpoint_metric: cold_ctr_ne
  cold_start_validation:
    field: "101"
    missing_rate: 0.33150923966261037
    seed: 42
  keep_checkpoint: best
  save_predictions: false
  gpus: -1
  load_test: false
  out_dir: artifacts
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0

model_params:
  architecture_version: 2
  emb_dim: 5
  conv_channels: [32, 64, 32]  # assumption: paper does not specify channel counts
  kernel_size: 3                # assumption: stride 1, padding 1, no pooling
  tower_dims: [128, 64, 32]
  dropout: 0.2                  # assumption: rate is unspecified
  alpha: 1.0                    # penalize direct conversion > click
  pooling: mean
  use_missing_embedding: true
  use_presence_features: true
  normalize_task_representations: true
  attention_score: cosine
  conversion_residual: true
  # Train both the ID-0 fallback and the towers on the observed cold-start rate.
  field_dropout:
    "101": 0.33150923966261037

data:
  csv_dir: ali-ccp/extracted
  encoded_dir: ali-ccp/encoded
